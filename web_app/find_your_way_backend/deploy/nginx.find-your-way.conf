# Find Your Way — nginx server block
#
# Serves the Flutter web build as static files at the domain root, and
# reverse-proxies the API + destination images to the pm2-managed Node
# backend running on 127.0.0.1:8999.
#
# Install (as root):
#   cp nginx.find-your-way.conf /etc/nginx/sites-available/find-your-way
#   ln -s /etc/nginx/sites-available/find-your-way /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d find-your-ways.duckdns.org
#
# Assumes: frontend build scp'd to /var/www/find-your-way, backend cloned
# to /root/find_your_way_backend. Adjust both paths below if yours differ.

server {
    listen 80;
    listen [::]:80;
    server_name find-your-ways.duckdns.org;

    root /var/www/find-your-way;
    index index.html;

    # Flutter web is a single-page app — unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Destination photos, served directly by nginx (no need to hit Node for these).
    location /static/ {
        alias /root/find_your_way_backend/static/;
        expires 30d;
        access_log off;
    }

    # REST API — proxied to the pm2-managed Express server.
    location /api/ {
        proxy_pass http://127.0.0.1:8999/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
